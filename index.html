<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2754C5">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="워크보드">
<title>워크보드</title>
<script>(function(){try{var t=localStorage.getItem('wb.theme');t=t?JSON.parse(t):'auto';if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t);}catch(e){}})();</script>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<style>
[hidden]{display:none!important}
body{margin:0;-webkit-text-size-adjust:100%}
:root{padding-top:env(safe-area-inset-top,0px)}
/* Layout: 좌측 사이드바 + 상단 바 + 본문 (데스크톱) / 상단 바 + 하단 탭 (모바일). 업무=파랑, 개인=보라, 임박=주황, 지연=빨강 */
:root{
  --bg:#F3F5F8;--surface:#FFFFFF;--surface2:#F7F8FA;--line:#DDE2E9;--line2:#EEF1F5;
  --fg:#18212F;--fg2:#4A5566;--fg3:#667085;--fg4:#98A2B3;
  --acc:#2754C5;--acc-soft:#E8EEFB;--acc-fg:#1F3F8F;--acc-line:#B9C9F0;
  --p:#6941C6;--p-soft:#F2EEFC;--p-fg:#4A2B9A;--p-line:#CDBFF3;
  --warn:#B54708;--warn-soft:#FEF0E6;--bad:#B42318;--bad-soft:#FDECEA;
  --band:#EEF0F3;--hol:#E1E5EB;--seg:#E6EAF0;--shadow:0 1px 2px rgba(16,24,40,.08);--overlay:rgba(24,33,47,.42);
  --sans:'IBM Plex Sans KR',-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F141B;--surface:#161C25;--surface2:#1C2330;--line:#2A3342;--line2:#222A36;
  --fg:#E6EAF0;--fg2:#B3BCC9;--fg3:#8A94A3;--fg4:#667085;
  --acc:#6E93F0;--acc-soft:#1D2B4D;--acc-fg:#BCD0FF;--acc-line:#34507F;
  --p:#A58BF0;--p-soft:#2A2145;--p-fg:#D6C9FF;--p-line:#4B3C7A;
  --warn:#F0A868;--warn-soft:#3A2616;--bad:#F08A80;--bad-soft:#3D1D1B;
  --band:#222A36;--hol:#2A3342;--seg:#222A36;--shadow:0 1px 2px rgba(0,0,0,.4);--overlay:rgba(0,0,0,.55);color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F141B;--surface:#161C25;--surface2:#1C2330;--line:#2A3342;--line2:#222A36;
  --fg:#E6EAF0;--fg2:#B3BCC9;--fg3:#8A94A3;--fg4:#667085;
  --acc:#6E93F0;--acc-soft:#1D2B4D;--acc-fg:#BCD0FF;--acc-line:#34507F;
  --p:#A58BF0;--p-soft:#2A2145;--p-fg:#D6C9FF;--p-line:#4B3C7A;
  --warn:#F0A868;--warn-soft:#3A2616;--bad:#F08A80;--bad-soft:#3D1D1B;
  --band:#222A36;--hol:#2A3342;--seg:#222A36;--shadow:0 1px 2px rgba(0,0,0,.4);--overlay:rgba(0,0,0,.55);color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:14px;line-height:1.45}
*{box-sizing:border-box}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
#app{display:flex;min-height:100%}
#side{width:216px;flex-shrink:0;background:var(--surface);border-right:1px solid var(--line);padding:18px 12px;display:flex;flex-direction:column;gap:14px;position:sticky;top:0;height:100vh;overflow-y:auto}
#wrap{flex:1;min-width:0;display:flex;flex-direction:column;padding:16px 24px 32px;gap:14px}
.brand{display:flex;align-items:center;gap:10px;padding:0 8px;font-weight:700;font-size:16px}
.logo{width:24px;height:24px;border-radius:7px;background:var(--acc);display:flex;align-items:center;justify-content:center}
.navh{font-size:11px;font-weight:600;color:var(--fg3);padding:0 10px 4px;letter-spacing:.02em}
.nav{display:flex;align-items:center;gap:10px;height:34px;padding:0 10px;border-radius:8px;border:0;background:transparent;font-size:14px;font-weight:500;color:var(--fg2);width:100%;text-align:left}
.nav:hover{background:var(--surface2)}
.nav.on{background:var(--acc-soft);color:var(--acc-fg);font-weight:600}
.nav .k{margin-left:auto;font-family:var(--mono);font-size:11px;color:var(--fg3);border:1px solid var(--line);border-radius:4px;padding:0 5px}
.nav .badge{margin-left:auto;font-size:11px;font-weight:700;color:#fff;background:var(--acc);border-radius:10px;padding:1px 7px}
.sync{font-size:12px;color:var(--fg3);padding:0 10px;display:flex;align-items:center;gap:6px}
.dot{width:7px;height:7px;border-radius:4px;display:inline-block;flex-shrink:0}
.top{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.top h1{margin:0;font-size:20px;font-weight:700;letter-spacing:-.3px;white-space:nowrap}
.dpw{position:relative}
.ddc{width:52px;justify-content:center;font-size:11px;flex-shrink:0}
.lgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.lcard{border:1px solid var(--line);border-radius:10px;padding:8px;display:flex;flex-direction:column;gap:6px;background:var(--surface)}
.lcard img{width:100%;height:110px;object-fit:cover;border-radius:6px;display:block;background:var(--surface2)}
.ptg{font-weight:700;margin-right:3px;padding-right:4px;border-right:1px solid currentColor;opacity:.8}
:root.nohelp .hint{display:none!important}
.dropon{outline:2px dashed var(--acc);outline-offset:-2px;background-color:var(--acc-soft)!important}
[draggable="true"]{cursor:grab}
.pp-btn{border:1px solid var(--line);background:var(--surface);color:var(--fg2);border-radius:7px;font-size:11px;padding:3px 7px;white-space:nowrap;align-self:center;opacity:.8}
.pp-btn:hover{opacity:1;border-color:var(--acc-line);color:var(--acc-fg)}
.swi{touch-action:pan-y;transition:transform .15s ease}
.swi.swiping{transition:none}
.swi.swok{background:var(--acc-soft)}
.mbox{display:flex;flex-wrap:wrap;gap:6px;align-items:center;border:1px solid var(--line);border-radius:8px;padding:5px 6px;background:var(--surface)}
.mbox .in{border:0;flex:1;min-width:140px;height:28px;padding:0 4px;background:transparent}
.mchip{padding:2px 2px 2px 8px;font-weight:500}
.mchip .xb{width:20px;height:20px}
.dz{cursor:pointer}
.wkb .day.dz:hover,.wka .dz:hover{background-color:var(--surface2)}
.h1btn{display:inline-flex;align-items:center;gap:6px;border:0;background:transparent;padding:4px 8px;margin:0 -8px;border-radius:8px;color:inherit}
.h1btn:hover{background:var(--seg)}
.h1btn .caret{font-size:11px;color:var(--fg3)}
.dp{position:absolute;top:calc(100% + 6px);left:-8px;z-index:60;width:300px;background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:0 16px 36px rgba(16,24,40,.22);padding:12px;display:flex;flex-direction:column;gap:8px}
.dph{display:flex;align-items:center;gap:6px}
.dpt{border:0;background:transparent;font-weight:700;font-size:14px;padding:6px;border-radius:8px}
.dpt:hover{background:var(--seg)}
.dpg{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;text-align:center}
.dpg .dw{font-size:11px;color:var(--fg3);padding:4px 0}
.dpg .dw.off{color:var(--fg4)}
.dd{position:relative;height:36px;border:0;background:transparent;border-radius:8px;font-size:13px;color:var(--fg)}
.dd:hover{background:var(--seg)}
.dd.off{color:var(--fg3);background:var(--band)}
.dd.out{opacity:.4}
.dd.now{box-shadow:inset 0 0 0 1.5px var(--acc);font-weight:700}
.dd.sel{background:var(--acc);color:#fff;font-weight:700}
.dd i{position:absolute;left:50%;bottom:4px;width:4px;height:4px;margin-left:-2px;border-radius:2px;background:var(--acc)}
.dd.sel i{background:#fff}
.dpm{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.dpm button{height:44px;border:1px solid var(--line);background:var(--surface);border-radius:9px;font-size:13px}
.dpm button.now{border-color:var(--acc)}
.dpm button.sel{background:var(--acc);color:#fff;border-color:var(--acc)}
.dpf{display:flex;gap:6px;flex-wrap:wrap;border-top:1px solid var(--line2);padding-top:8px}
.top .sub{font-size:12px;color:var(--fg3);white-space:nowrap}
.grow{flex:1 1 auto}
.ib{width:32px;height:32px;border:1px solid var(--line);background:var(--surface);border-radius:7px;color:var(--fg2);font-size:15px;display:inline-flex;align-items:center;justify-content:center}
.btn{border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:8px;padding:7px 12px;font-size:13px;font-weight:500;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{border-color:var(--fg4)}
.btn.pri{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:600}
.btn.danger{background:var(--bad);border-color:var(--bad);color:#fff}
.btn.ghost{border-color:transparent;background:transparent;color:var(--fg2)}
.btn.sm{padding:4px 9px;font-size:12px;border-radius:6px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.seg{display:flex;background:var(--seg);border-radius:9px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;padding:6px 12px;border-radius:7px;font-size:13px;font-weight:500;color:var(--fg2);display:flex;align-items:center;gap:6px;white-space:nowrap}
.seg button.on{background:var(--surface);color:var(--fg);font-weight:600;box-shadow:var(--shadow)}
.qa{display:flex;align-items:center;gap:8px;width:260px;height:36px;border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:0 8px 0 12px;color:var(--fg3);font-size:13px}
.kbd{font-family:var(--mono);font-size:11px;color:var(--fg3);border:1px solid var(--line);border-radius:4px;padding:0 5px;background:var(--surface)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;gap:10px;min-width:0}
.card h2{margin:0;font-size:15px;font-weight:700}
.ch{display:flex;align-items:baseline;gap:8px}
.ch .grow+a,.ch .lnk{font-size:12px;font-weight:600;color:var(--acc);text-decoration:none;cursor:pointer;background:none;border:0;padding:0}
.muted{color:var(--fg3);font-size:12px}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:11px;border-radius:5px;padding:2px 7px;white-space:nowrap;font-weight:600}
.c-w{background:var(--acc-soft);color:var(--acc-fg)}
.c-p{background:var(--p-soft);color:var(--p-fg)}
.c-warn{background:var(--warn-soft);color:var(--warn)}
.c-bad{background:var(--bad-soft);color:var(--bad)}
.c-g{background:var(--band);color:var(--fg2)}
.c-evt{background:var(--acc);color:#fff}
.c-dash{border:1px dashed var(--fg4);color:var(--fg2)}
.row{display:flex;align-items:center;gap:10px;min-width:0}
.item{display:flex;align-items:flex-start;gap:10px;padding:6px 4px;border-radius:8px;min-width:0}
.item:hover{background:var(--surface2)}
.item .t{font-size:13px;font-weight:500;cursor:pointer;min-width:0;overflow-wrap:anywhere}
.item .m{font-size:12px;color:var(--fg3)}
.cb{width:18px;height:18px;flex-shrink:0;border-radius:5px;border:1.5px solid var(--fg4);background:var(--surface);display:inline-flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:#fff;padding:0;margin-top:1px}
.cb.on{background:var(--acc);border-color:var(--acc)}
.cb.p.on{background:var(--p);border-color:var(--p)}
.done .t{text-decoration:line-through;color:var(--fg3)}
.grid3{display:grid;grid-template-columns:minmax(0,340px) minmax(0,1fr) minmax(0,320px);gap:14px;align-items:start}
.col{display:flex;flex-direction:column;gap:14px;min-width:0}
.resbar{display:flex;align-items:center;gap:16px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 16px;flex-wrap:wrap}
.resbar .txt{font-size:13px;color:var(--fg2)}
.resbar b{color:var(--fg)}
.bar{flex:1 1 160px;height:8px;background:var(--seg);border-radius:4px;overflow:hidden;display:flex;min-width:120px}
.bar i{display:block;height:100%}
/* timeline */
.tl{position:relative}
.tl .hr{position:absolute;left:0;font-family:var(--mono);font-size:11px;color:var(--fg3)}
.tl .ln{position:absolute;left:40px;right:0;border-top:1px solid var(--line2)}
.blk{position:absolute;box-sizing:border-box;border-radius:6px;padding:4px 8px;font-size:12px;overflow:hidden;cursor:pointer;display:flex;flex-direction:column;gap:1px;border:0;text-align:left;line-height:1.3}
.blk b{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.blk.one{padding:0 8px;justify-content:center}
.stk{position:absolute;display:flex;flex-direction:column;gap:2px;z-index:1}
.stk .blk{width:100%;flex-shrink:0}
.blk .tm{font-family:var(--mono);font-weight:500;font-size:11px;opacity:.75;margin-right:6px}
.blk.w{background:var(--acc-soft);color:var(--acc-fg)}
.blk.pp{background:var(--p-soft);color:var(--p-fg)}
.blk.now{background:var(--acc);color:#fff}
.blk.done{opacity:.55}
.blk.lunch{background:repeating-linear-gradient(135deg,var(--surface2) 0 6px,var(--band) 6px 12px);color:var(--fg3);cursor:default;justify-content:center;align-items:center}
.blk.band{background:var(--band);color:var(--fg3);cursor:default}
.blk.free.pfree{border-color:var(--p-line);color:var(--p-fg)}
.blk.free{background:transparent;border:1.5px dashed var(--acc-line);color:var(--fg3);justify-content:center;align-items:center}
.blk.mv{background:repeating-linear-gradient(135deg,var(--surface) 0 7px,var(--surface2) 7px 14px);border:1.5px solid var(--fg4);color:var(--fg)}
.blk.over{background:var(--bad-soft);color:var(--bad);border:1.5px solid var(--bad)}
.nowline{position:absolute;left:34px;right:0;border-top:2px solid var(--acc)}
/* week */
.wk{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.wkh,.wka,.wkb{display:flex}
.wkh>div,.wka>div,.wkb>div.day{flex:1 1 0;min-width:0;border-left:1px solid var(--line2)}
.wkh>div:first-child,.wka>div:first-child,.wkb>div:first-child{flex:0 0 44px;border-left:0}
.wkh .d{padding:8px 10px;display:flex;flex-direction:column;gap:5px;cursor:pointer;border:0;background:transparent;text-align:left;width:100%;height:100%}
.wkh{border-bottom:1px solid var(--line)}
.wka{border-bottom:1px solid var(--line)}
.wka>div{padding:5px 6px;display:flex;flex-direction:column;gap:3px;min-height:34px}
.wkb .day{position:relative}
.off{background:var(--surface2)}
.today-bg{background:var(--acc-soft)}
.tag-today{background:var(--acc);color:#fff;border-radius:10px;padding:0 7px;font-size:12px;font-weight:700}
.mini{height:4px;background:var(--seg);border-radius:2px;overflow:hidden;flex:1}
.mini i{display:block;height:100%}
/* month */
.mg{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.mg .wd{font-size:12px;color:var(--fg3);padding:6px 10px;border-bottom:1px solid var(--line)}
.mc{min-height:104px;padding:6px 7px;display:flex;flex-direction:column;gap:3px;border-top:1px solid var(--line2);border-left:1px solid var(--line2);cursor:pointer;min-width:0;overflow:hidden;background:var(--surface);text-align:left;border-right:0;border-bottom:0}
.mc:nth-child(7n+1){border-left:0}
.mc .n{font-size:12px;font-weight:600;display:flex;gap:5px;align-items:center}
.mc .n .h{font-size:11px;color:var(--fg2);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mc .ev{font-size:11px;border-radius:4px;padding:1px 5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mc.out .n{color:var(--fg4)}
.mc.off{background:var(--surface2)}
/* year */
.yr{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:12px}
.yr table{border-collapse:collapse;width:100%;min-width:960px;table-layout:fixed}
.yr th,.yr td{border-right:1px solid var(--line2);border-bottom:1px solid var(--line2);padding:0;height:22px}
.yr th{font-size:12px;height:28px;background:var(--surface);cursor:pointer}
.yr th.cur{background:var(--acc);color:#fff}
.yr td.dn{width:30px;text-align:center;font-size:11px;color:var(--fg3);position:sticky;left:0;background:var(--surface);z-index:1}
.yr td.c{font-size:11px;padding:0 5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer}
.yr td.x{background:repeating-linear-gradient(135deg,var(--surface) 0 4px,var(--surface2) 4px 8px)}
.yr td.off{background:var(--hol);color:var(--fg2)}
.yr td.today{outline:2px solid var(--acc);outline-offset:-2px}
.yr td.past{opacity:.6}
/* lists */
.tbl{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.tr{display:grid;gap:10px;align-items:center;padding:10px 16px;border-bottom:1px solid var(--line2);width:100%;background:transparent;border-left:0;border-right:0;border-top:0;text-align:left;font-size:13px}
.tr.hd{font-size:12px;color:var(--fg3);border-bottom:1px solid var(--line);padding:9px 16px}
button.tr:hover{background:var(--surface2)}
.tr.sel{background:var(--acc-soft);box-shadow:inset 3px 0 0 var(--acc)}
.ell{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,460px);gap:14px;align-items:start}
.fl{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.pill{border:1px solid var(--line);background:var(--surface);color:var(--fg2);font-size:13px;padding:6px 12px;border-radius:16px}
.pill.on{background:var(--fg);border-color:var(--fg);color:var(--bg);font-weight:600}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 16px}
.kpi .l{font-size:12px;color:var(--fg3)}
.kpi .v{font-size:20px;font-weight:700;font-variant-numeric:tabular-nums}
.bars{display:flex;gap:6px;align-items:flex-end}
.bars .b{flex:1 1 0;min-width:0;display:flex;flex-direction:column;gap:4px;cursor:pointer;border:0;background:transparent;padding:0}
.bars .trk{position:relative;height:130px;background:var(--surface2);border-radius:5px}
.bars .v{font-size:10px;text-align:center;color:var(--fg2);font-variant-numeric:tabular-nums;white-space:nowrap}
.bars .lb{font-size:11px;color:var(--fg2);text-align:center;white-space:nowrap;overflow:hidden}
.hbar{display:flex;align-items:center;gap:8px;font-size:13px}
.hbar .nm{width:120px;flex-shrink:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hbar .trk{flex:1;height:8px;background:var(--line2);border-radius:4px;overflow:hidden}
.hbar .trk i{display:block;height:100%;border-radius:4px}
.hbar .val{width:64px;text-align:right;font-variant-numeric:tabular-nums;font-weight:600}
/* forms */
label.f{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--fg2);min-width:0}
.in{height:36px;border:1px solid var(--line);border-radius:8px;padding:0 10px;background:var(--surface);font-size:13px;width:100%;min-width:0}
textarea.in{height:auto;padding:8px 10px;resize:vertical;min-height:60px;line-height:1.5}
.in:focus{border-color:var(--acc);outline:none}
.fgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.opt{border:1px solid var(--line);background:var(--surface);color:var(--fg2);font-size:12px;padding:5px 10px;border-radius:7px}
.opt.on{border-color:var(--acc);background:var(--acc-soft);color:var(--acc-fg);font-weight:600}
.warnbox{font-size:12px;border-radius:8px;padding:8px 10px;background:var(--surface2);color:var(--fg2)}
.warnbox.bad{background:var(--bad-soft);color:var(--bad);font-weight:600}

    if (m) { let y = +today.slice(0, 4); let s = y + '-' + pad(m[1]) + '-' + pad(m[2]); if (s < add(today, -60)) s = (y + 1) + '-' + pad(m[1]) + '-' + pad(m[2]); out.date = s; t = t.replace(m[0], ' '); } }

    if (m) { const target = W.indexOf(m[2]); const ws = add(weekStart(today), 7); out.date = add(ws, (target + 6) % 7); t = t.replace(m[0], ' '); } }
  if (!out.date && !out.freq) { m = t.match(/(?:^|\s)(이번\s*주\s*)?([월화수목금토일])(요일)?(?=\s)/);
    if (m) { const target = W.indexOf(m[2]); let k = today; for (let i = 0; i < 7; i++) { if (dow(k) === target) break; k = add(k, 1); } out.date = k; t = t.replace(m[0], ' '); } }

const FREQ = { daily: '매일', weekly: '매주', biweekly: '격주', mfirst: '매월 첫 근무일', mlast: '매월 마지막 근무일', mday: '매월' };

function goalBar(p, compact){

/* ----- 리소스 ----- */
function periodRange(per, s){
  if (per === 'day') return [s, s];
  if (per === 'week') { const a = weekStart(s); return [a, add(a, 6)]; }
  if (per === 'month') { const y = +s.slice(0, 4), m = +s.slice(5, 7); return [y + '-' + pad(m) + '-01', y + '-' + pad(m) + '-' + pad(daysInMonth(y, m))]; }
  const y = s.slice(0, 4); return [y + '-01-01', y + '-12-31'];
}
function subBuckets(per, from, to){
  const b = [];
  if (per === 'week' || per === 'day') { for (let s = from; s <= to; s = add(s, 1)) b.push([W[dow(s)] + ' ' + md(s), s, s]); }
  else if (per === 'month') { let s = from; while (s <= to) { const e0 = add(weekStart(s), 6), e = e0 > to ? to : e0; b.push([md(s) + '–' + md(e), s, e]); s = add(e, 1); } }
  else { const y = +from.slice(0, 4); for (let m = 1; m <= 12; m++) b.push([m + '월', y + '-' + pad(m) + '-01', y + '-' + pad(m) + '-' + pad(daysInMonth(y, m))]); }
  return b;
}

/* 소요 시간 추천: 분류별 실제 걸린 시간 평균 (최근 20건) */
function actualOf(i){ return i.actual != null ? +i.actual : (i.logged ? +i.dur : null); }
function durStats(area){
  const L = Object.values(S.items).filter(i => i.kind === 'task' && i.done && (!area || i.area === area) && actualOf(i) != null && actualOf(i) > 0).sort((a, b) => (b.doneAt || 0) - (a.doneAt || 0)).slice(0, 20);
  if (L.length < 3) return null;
  const avg = L.reduce((a, i) => a + actualOf(i), 0) / L.length;
  const est = L.filter(i => i.est > 0); const ratio = est.length >= 3 ? est.reduce((a, i) => a + actualOf(i), 0) / est.reduce((a, i) => a + +i.est, 0) : null;
  return { n: L.length, avg: Math.max(0.25, Math.round(avg * 4) / 4), ratio };
}
/* 여러 줄 붙여넣기 · 음성 */

    const p = parseQuick(line, 'task');
    if (!p.title && p.date && !p.ltype) { ctx = p.date; return; } // 날짜만 있는 줄 = 아래 줄들의 날짜
    let date = p.date || ctx || baseDate || TODAY();
    if (p.ltype && !/\d{4}-/.test(line) && date > add(TODAY(), 120)) date = (+date.slice(0, 4) - 1) + date.slice(4); // 근태는 지난 기록으로

}
const BK = { task: ['할 일', 'c-w'], event: ['일정', 'c-w'], move: ['이동', 'c-g'], leave: ['근태', 'c-g'], deleg: ['위임', 'c-warn'], routine: ['반복', 'c-g'] };

let REC = null;
const SR = () => window.SpeechRecognition || window.webkitSpeechRecognition;

function startMic(){
  const C = SR(); if (!C) { toast('이 브라우저는 음성 입력을 지원하지 않아요. 키보드의 마이크 버튼으로 말해 보세요.'); return; }

async function editSave(extra){

/* ========== 이벤트 ========== */
function setPath(obj, path, val){ const k = path.split('.'); let o = obj; for (let i = 0; i < k.length - 1; i++) { o = o[isNaN(k[i]) ? k[i] : +k[i]]; if (o == null) return; } o[k[k.length - 1]] = val; }
function go(r){ V.route = r; renderAndScroll(); }
function renderAndScroll(){ render(); window.scrollTo(0, 0); }
function toast(t, undo){ const el = $('toast'); el.innerHTML = h(t) + (undo ? ' <button class="tbtn" data-act="undo">되돌리기</button>' : ''); el.hidden = false; if (!undo) UNDO = null; clearTimeout(toast.t); toast.t = setTimeout(() => { el.hidden = true; if (undo) UNDO = null; }, undo ? 7000 : 2600); }
let UNDO = null;
const UCOLS = ['items', 'delegs', 'projects', 'routines'];
function snap(){ const o = {}; UCOLS.forEach(c => { o[c] = clean(S[c]); }); return o; }
async function undoable(msg, fn){ const before = snap(); await fn(); UNDO = before; toast(msg, true); }
function doUndo(){
  if (!UNDO) return; const b = UNDO; UNDO = null; PLOCK++;
  try { UCOLS.forEach(c => { Object.keys(S[c]).forEach(id => { if (!b[c][id]) del(c, id); }); Object.keys(b[c]).forEach(id => { if (JSON.stringify(b[c][id]) !== JSON.stringify(S[c][id])) { const o = Object.assign({}, b[c][id]); delete o.id; delete o.up; put(c, id, o); } }); }); }
  finally { PLOCK--; }
  toast('되돌렸어요');
}
async function copyText(t){ try { await navigator.clipboard.writeText(t); toast('복사했어요'); } catch (e) { openModal({ title: '복사', body: () => `<textarea class="in" id="cp" rows="8" readonly>${h(t)}</textarea><span class="muted">자동 복사가 막혀 있어요. 위 내용을 길게 눌러 복사하세요.</span>` }); setTimeout(() => { const el = $('cp'); if (el) el.select(); }, 30); } }
function shiftCur(d){

document.addEventListener('keydown', e => {
